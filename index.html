["說明私人邏輯的意義及其在治療中的角色，並舉例。","私人邏輯是個人關於自己、他人與生命的信念與哲學，是建構生活型態的基礎，常未必符合現實。在治療中，當事人要探索並覺察自己的私人邏輯，再檢視它是否造成沮喪或失能。例：『我必須完美，否則沒人喜歡我』，使人不敢嘗試；經過探索後可以修正為更有彈性、更社會化的信念。"],
["說明 Adler 學派諮商員的功能與角色。","Adler 學派認為當事人的沮喪、失能來自錯誤信念、偏差價值觀與無效或自我破壞的目標。因此諮商員的主要功能是全面評估當事人的功能：常用問卷蒐集家庭星座（父母、手足、同住家人關係）與早期回憶，把早期回憶作為診斷工具，進行生活型態評估，了解動機與目的，再協助當事人修正信念與目標。"],

es:[["完整說明 Adler 治療的四階段。","階段一建立關係；階段二評估心理動力（家庭星座、早期回憶、統整摘要）；階段三鼓勵自我了解與領悟；階段四重新定向與再教育（鼓勵、新可能性、製造不同）。"],
["舉例說明如何在重新定向階段製造『不同』。","當事人習慣逃避社交，諮商員鼓勵他做一個小行動，如邀請一位朋友喝咖啡，並討論結果。這個新經驗挑戰舊信念，建立自信與社會興趣。"],
["說明階段二『評估個體的心理動力』的內容與目的。","階段二包含三部分：家庭星座（父母、手足與同住家人的關係）、早期回憶（10 歲以前的事件與當時心情想法），以及統整與摘要。目的是了解當事人的生活型態、動機與目的，找出其私人邏輯與錯誤信念，作為後續領悟與重新定向的基礎。例：長子、父母期待高、早期回憶是被批評，可統整出『要完美才能被接納』的主題。"],
["說明階段四『重新定向與再教育』的重點，並舉例。","階段四把洞察化為行動，包含三個重點：鼓勵過程（增強信心、看見自己的資源）、改變與找出新的可能性、製造『不同』（嘗試新的想法與行為）。目標是修正錯誤信念與目標，使生活型態更適應、有彈性與社會化。例：當事人慣於逃避社交，就鼓勵他這週邀請一位同事午餐，再一起討論結果與感受。"],
["說明 Adler 取向在家庭諮商與團體諮商上的應用。","家庭諮商可用來了解家人互動模式與手足關係，協助家人彼此鼓勵、改善親子溝通與教養方式，也呼應 Adler 在學校與社區提供兒童輔導與家庭諮商的實踐。團體諮商則透過同儕互動促進社會興趣與歸屬感，讓成員在團體中練習合作、接納與平等相待。例：親職團體學習以鼓勵取代責罵。"]]}];
